<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Page</title>
<style>
:root{--bg:#f6f7f9;--text:#16181d;--muted:#5d6470;--accent:#2f5bea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--text:#e8eaee;--muted:#9aa1ad;--accent:#7b9bff}}
:root[data-theme="dark"]{--bg:#0f1115;--text:#e8eaee;--muted:#9aa1ad;--accent:#7b9bff}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;padding:16px;text-align:center}
h1{margin:0 0 8px}p{color:var(--muted);margin:0 0 20px}
button{padding:10px 20px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<div>
  <h1>Hello from GittyCandy 👋</h1>
  <p>This is a simple test page.</p>
  <button onclick="this.textContent='Clicked ' + (++window.n||(window.n=1)) + '×'">Click me</button>
</div>
</body>
</html>
